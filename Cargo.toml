[package]
name = "openwhatsapp"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Native Rust GTK4/WebKitGTK desktop client for WhatsApp Web."
license = "MIT"

[dependencies]
anyhow = "1.0"
dirs = "6.0"
enchant = "0.3"
gio = "0.22"
gdk-pixbuf = "0.22"
glib = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk3 = { package = "gtk", version = "0.18", optional = true }
libappindicator = { version = "0.9", optional = true }
once_cell = "1.21"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
webkit6 = { version = "0.6", features = ["v2_42"] }

[features]
default = []
appindicator-tray = ["dep:gtk3", "dep:libappindicator"]
